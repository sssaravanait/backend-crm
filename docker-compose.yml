name: backend-crm

# Shared log rotation settings, reused by every service (DRY)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:8
    container_name: crm-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    logging: *default-logging
    networks:
      - crm-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: crm-api
    restart: unless-stopped
    # Loads JWT_SECRET, CLIENT_ORIGIN, etc. from .env (the file must exist)
    env_file: .env
    environment:
      # Overrides the localhost URI in .env so the container reaches Mongo by service name
      MONGO_URI: mongodb://mongo:27017/mini_crm
    volumes:
      - ./src:/app/src              # Bind mount: host edits reach the container
      - /app/node_modules           # Anonymous volume: keeps Linux node_modules, not your Windows ones
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    networks:
      - crm-net

volumes:
  mongo-data:

networks:
  crm-net:
    driver: bridge